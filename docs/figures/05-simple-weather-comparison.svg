  </g>
  <g id="text_43">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #223442" x="43.2" y="548.5536" transform="rotate(-0 43.2 548.5536)">Example: +106% means about 2.06 times the usual Q3 flash-flood record count—not a revenue increase.</text>
  </g>
  <g id="text_44">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #52616d" transform="translate(43.2 561.132)">Source: NOAA Storm Events, revised 2010–2025 data, U.S. states/DC; retrieved September 29, 2026.</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #52616d" transform="translate(43.2 572.382)">Reference: 63 complete fiscal quarters; 15–16 per quarter number, including FY2025.</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #52616d" transform="translate(43.2 583.632)">Counts are records, not unique storms, insured losses or Copart volumes. No financial effect is estimated.</text>
  </g>
 </g>
